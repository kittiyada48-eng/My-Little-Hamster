const zip=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))),unzip=t=>JSON.parse(decodeURIComponent(escape(atob(t.replace(/\s/g,'')))));
const gather=pc=>new Promise(r=>{if(pc.iceGatheringState=='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState=='complete'&&r();setTimeout(r,4000)});
function wrapDC(dc){const h={},c={open:dc.readyState=='open',on(e,f){h[e]=f},send(m){dc.send(JSON.stringify(m))},close(){try{dc.close()}catch(e){}}};dc.onopen=()=>{c.open=true;h.open&&h.open()};dc.onmessage=e=>{try{h.data&&h.data(JSON.parse(e.data))}catch(x){}};dc.onclose=()=>{c.open=false;h.close&&h.close()};return c}
function mkPC(){const pc=NET.pc=new RTCPeerConnection({iceServers:ICE});pc.onconnectionstatechange=()=>{if(NET.pc===pc&&pc.connectionState=='failed')netErr('เชื่อมตรงไม่ได้ (เครือข่ายบล็อก) ลองเปลี่ยนเน็ตแล้วทำใหม่')};return pc}
async function manHost(){if(typeof RTCPeerConnection=='undefined')return say(S.cur,'เบราว์เซอร์นี้ไม่รองรับ WebRTC',180);bye();NET.msg='';NET.st='man';NET.mode='';render();const pc=mkPC(),dc=pc.createDataChannel('g');NET.c=wrapDC(dc);NET.c.on('open',()=>up(0));
await pc.setLocalDescription(await pc.createOffer());await gather(pc);NET.out=zip(pc.localDescription);NET.mode='h';render()}
async function manAns(){try{await NET.pc.setRemoteDescription(unzip(($('#mi')||{}).value||''));say(S.cur,'กำลังเชื่อมต่อ...',180)}catch(e){say(S.cur,'โค้ดตอบกลับไม่ถูกต้อง',180)}}
async function manJoin(){if(typeof RTCPeerConnection=='undefined')return say(S.cur,'เบราว์เซอร์นี้ไม่รองรับ WebRTC',180);let o;try{o=unzip(($('#mi')||{}).value||'')}catch(e){return say(S.cur,'โค้ดเชิญไม่ถูกต้อง',180)}
bye();NET.msg='';NET.st='man';NET.mode='';render();const pc=mkPC();pc.ondatachannel=e=>{NET.c=wrapDC(e.channel);NET.c.on('open',()=>up(1));if(e.channel.readyState=='open')up(1)};
try{await pc.setRemoteDescription(o);await pc.setLocalDescription(await pc.createAnswer());await gather(pc);NET.out=zip(pc.localDescription);NET.mode='g';render()}catch(e){netErr('โค้ดเชิญไม่ถูกต้อง')}}
function NETUI(){const ta=(id,v,ro)=>`<textarea id="${id}" ${ro?'readonly':''} rows="3" placeholder="วางโค้ดที่นี่" style="width:100%;font-size:11px;border-radius:10px;border:2px solid var(--br);background:var(--cd);color:var(--ink)">${v||''}</textarea>`;
if(NET.on)return `<div class="row"><span>🟢 เลี้ยงด้วยกัน · คุณเป็น ${PN2(ROLE)} (${NET.me?'แขก':'เจ้าของห้อง'}) · อีกฝ่ายเป็น ${PN2(PROLE)}</span>${B('bye','','ตัดการเชื่อมต่อ')}</div>`;
if(NET.st=='wait'||NET.st=='join')return `<div class="row"><span>⏳ ${PN2(ROLE)} · รหัสห้อง <b>${NET.code}</b> · ${NET.st=='wait'?'รอเพื่อน (เปิดหน้านี้ค้างไว้ อย่าสลับแอป)':'กำลังเชื่อมต่อ...'}</span>${B('bye','','ยกเลิก')}</div>`;
if(NET.st=='man')return `<div class="row"><span>🔗 โหมดโค้ด · ${NET.mode=='h'?'1) คัดลอกโค้ดเชิญส่งให้เพื่อน 2) วางโค้ดตอบกลับด้านล่าง':NET.mode=='g'?'คัดลอกโค้ดนี้ส่งกลับให้เจ้าของห้อง แล้วรอเชื่อมต่อ':'กำลังสร้างโค้ด...'}</span>${B('bye','','ยกเลิก')}</div>`+(NET.out?ta('mo',NET.out,1)+B('copy','','📋 คัดลอกโค้ด'):'')+(NET.mode=='h'?ta('mi','')+B('mans','','✅ เชื่อมต่อ'):'');
return (NET.msg?`<p>⚠️ ${NET.msg}</p>`:'')+`<div class="row"><span>🌐 เล่น 2 คนออนไลน์</span></div><div class="row"><span>🙋 คุณคือ (เลือกก่อนเข้าห้อง)</span><span>${B('role',0,(ROLE==0?'✅ ':'')+'👨 พ่อ')}${B('role',1,(ROLE==1?'✅ ':'')+'👩 แม่')}</span></div>`+B('host','','🏠 สร้างห้อง เป็น '+PN2(ROLE))+`<div class="row"><input id="rc" maxlength="4" inputmode="numeric" placeholder="รหัส 4 หลัก" style="width:100px;font:inherit;padding:5px;border-radius:10px;border:2px solid var(--br);background:var(--cd);color:var(--ink)">${B('join','','🚪 เข้าห้อง เป็น '+PN2(ROLE))}</div><div class="row"><span>🔗 เข้าห้องไม่ได้? ใช้โหมดโค้ด (ไม่ผ่านเซิร์ฟเวอร์)</span></div>`+B('manhost','','สร้างโค้ดเชิญ (เจ้าของห้อง)')+ta('mi','')+B('manjoin','','วางโค้ดเชิญของเพื่อน → สร้างโค้ดตอบกลับ');}
function up(me){if(NET.on)return;NET.on=1;NET.me=me;NET.st='on';NET.c.on('data',onData);NET.c.on('close',bye);net({t:'hi',role:ROLE});PROLE=1-ROLE;
if(me)R.forEach(r=>{r.rem=1;r.n++;rst(r);r.ls=r.lb=r.lg2=''});else{net({t:'S',S:fullS()});NET.k=0;NET.iv=setInterval(()=>{net({t:'s',a:[snap(0),snap(1)],gm:S.gm});if(++NET.k%5==0)net({t:'S',S:fullS()})},200)}
showCage();say(S.cur,'เชื่อมต่อแล้ว! เลี้ยงด้วยกันนะ 🎉',180)}
function bye(){const was=NET.on,c=NET.c,p=NET.p,pc=NET.pc;clearInterval(NET.iv);NET.on=0;NET.c=NET.p=NET.pc=null;NET.st=NET.code=NET.out=NET.mode='';wl(0);try{c&&c.close();p&&p.destroy();pc&&pc.close()}catch(e){}
if(was)R.forEach((r,q)=>{if(r.rem){r.rem=0;r.n++;rst(r);r.ri.setAttribute('class','ri');put(r,58,211,0);cheek(r);drawBG(q);drawFG(q);drawFL(q)}});showCage()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&NET.p&&NET.p.disconnected&&!NET.p.destroyed)try{NET.p.reconnect()}catch(e){}});
init();
</script></body></html>
